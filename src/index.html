<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafb" />
    <meta
      name="description"
      content="花生起始页，一个轻盈、安静，又有一点惊喜的浏览器首页。"
    />
    <title>花生 · 新的一页</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="wash wash-blue"></div>
      <div class="wash wash-peach"></div>
      <div class="wash wash-mint"></div>
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
    </div>
    <header class="topbar">
      <a class="brand" href="./" aria-label="花生起始页"
        ><span class="brand-symbol">✳</span
        ><span>peanut<span class="brand-dot">.</span></span
        ><span class="brand-caption">给灵感，一个起点</span></a
      >
      <div class="top-actions">
        <span class="today-label" id="short-date"></span
        ><button
          class="icon-button"
          id="settings-button"
          aria-label="打开设置"
          title="个性化设置"
          data-icon="settings"
        ></button>
      </div>
    </header>

    <main>
      <section class="hero" aria-label="时钟与搜索">
        <div class="eyebrow">
          <span class="live-dot"></span> A LITTLE SPACE FOR YOUR NEXT BIG IDEA
        </div>
        <div class="clock-wrap">
          <div class="clock-decoration decoration-left" aria-hidden="true">
            ✳
          </div>
          <time class="clock" id="clock" aria-label="当前时间"
            >--<span>:</span>--</time
          >
          <div class="clock-decoration decoration-right" aria-hidden="true">
            ✧
          </div>
        </div>
        <h1 id="greeting">新的一天，慢慢来。</h1>
        <p class="date-line" id="date-line"></p>

        <div class="search-area">
          <div class="engine-tabs" role="group" aria-label="搜索引擎">
            <button type="button" data-engine="google">
              <span class="google-letter" aria-hidden="true">G</span>
              Google</button
            ><button type="button" data-engine="bing">
              <span class="bing-letter" aria-hidden="true">b</span> 必应</button
            ><button type="button" data-engine="baidu">
              <span class="baidu-letter" aria-hidden="true">du</span> 百度
            </button>
          </div>
          <form
            class="search-box"
            role="search"
            id="search-form"
            action="https://www.google.com/search"
            method="get"
          >
            <span
              class="search-icon"
              data-icon="search"
              aria-hidden="true"
            ></span>
            <label for="search-input" class="sr-only"
              >搜索关键词或输入网址</label
            >
            <input
              id="search-input"
              name="q"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="搜索点什么，让好奇心带路"
              maxlength="2048"
              required
            />
            <kbd class="search-shortcut">/</kbd
            ><button
              class="search-submit"
              type="submit"
              aria-label="开始搜索"
              data-icon="arrow"
            ></button>
          </form>
          <div
            class="suggestions"
            id="suggestions"
            hidden
            role="region"
            aria-label="搜索推荐、历史记录与快捷网站"
          ></div>
          <p class="search-hint">整个互联网，从这里出发 <span>↵</span></p>
        </div>
      </section>

      <section class="bookmarks-section" aria-labelledby="bookmarks-title">
        <div class="section-heading">
          <div class="section-title">
            <span class="tiny-icon" data-icon="grid" aria-hidden="true"></span>
            <h2 id="bookmarks-title">常去的地方</h2>
            <span class="bookmark-count" id="bookmark-count"></span>
          </div>
          <div class="bookmark-actions">
            <button class="text-button" id="edit-button">整理</button
            ><button
              class="add-button"
              id="add-button"
              aria-label="添加快捷网站"
              title="添加快捷网站"
            >
              +
            </button>
          </div>
        </div>
        <div class="bookmark-grid" id="bookmark-grid"></div>
      </section>

      <div class="daily-note">
        <span aria-hidden="true">✧</span>
        <p>保持好奇，好事正在发生。</p>
        <span class="note-rule"></span
        ><span class="note-caption">JUST A LITTLE REMINDER</span>
      </div>
    </main>

    <footer class="footer">
      <div class="footer-left">
        <span class="footer-spark">✳</span><span>新的一页，无限可能。</span>
      </div>
      <div class="footer-actions">
        <button id="motion-button" class="footer-button" aria-pressed="true">
          <span class="live-dot"></span>流光已开启</button
        ><span class="footer-divider"></span
        ><button id="focus-button" class="footer-button" aria-pressed="false">
          <span data-icon="focus"></span>专注一下
        </button>
      </div>
    </footer>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-heading">
        <div>
          <p class="dialog-kicker">MAKE IT YOURS</p>
          <h2 id="settings-title">你喜欢的样子</h2>
        </div>
        <button
          type="button"
          class="icon-button close-dialog"
          aria-label="关闭设置"
          data-icon="close"
        ></button>
      </div>
      <form id="settings-form">
        <label class="field-label" for="display-name">怎么称呼你</label
        ><input
          class="field-input"
          id="display-name"
          maxlength="24"
          placeholder="留空也很好"
        />
        <fieldset>
          <legend>今天的颜色</legend>
          <div class="theme-options">
            <label class="theme-option theme-cloud"
              ><input type="radio" name="theme" value="cloud" /><span></span
              >晴空</label
            ><label class="theme-option theme-mint"
              ><input type="radio" name="theme" value="mint" /><span></span
              >薄荷</label
            ><label class="theme-option theme-peach"
              ><input type="radio" name="theme" value="peach" /><span></span
              >日光</label
            >
          </div>
        </fieldset>
        <label class="toggle-row"
          ><span
            >流光与悬停动效<small
              >系统开启“减少动态效果”时会自动静止</small
            ></span
          ><input id="motion-setting" type="checkbox" role="switch"
        /></label>
        <label class="toggle-row"
          ><span>在新标签页打开<small>搜索和快捷网站保留当前首页</small></span
          ><input id="new-tab-setting" type="checkbox" role="switch"
        /></label>
        <p class="privacy-note">偏好和快捷网站仅保存在当前浏览器。</p>
        <button class="primary-button" type="submit">
          保存，开启新的一页 <span>↗</span>
        </button>
      </form>
    </dialog>

    <dialog id="bookmark-dialog" aria-labelledby="bookmark-dialog-title">
      <div class="dialog-heading">
        <div>
          <p class="dialog-kicker">YOUR LITTLE CORNER</p>
          <h2 id="bookmark-dialog-title">添加常去的地方</h2>
        </div>
        <button
          type="button"
          class="icon-button close-dialog"
          aria-label="关闭快捷网站编辑"
          data-icon="close"
        ></button>
      </div>
      <form id="bookmark-form">
        <input id="bookmark-id" type="hidden" /><label
          class="field-label"
          for="bookmark-name"
          >网站名称</label
        ><input
          class="field-input"
          id="bookmark-name"
          maxlength="30"
          required
          placeholder="例如：我的灵感库"
        /><label class="field-label" for="bookmark-url">网址</label
        ><input
          class="field-input"
          id="bookmark-url"
          maxlength="2048"
          required
          placeholder="https://example.com"
          inputmode="url"
        />
        <p id="bookmark-error" class="form-error" role="alert"></p>
        <div class="dialog-form-actions">
          <button
            type="button"
            class="delete-button"
            id="delete-bookmark"
            hidden
          >
            删除网站</button
          ><button class="primary-button" type="submit">
            保存网站 <span>↗</span>
          </button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
